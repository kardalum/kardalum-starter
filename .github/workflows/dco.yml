# .github/workflows/dco.yml
name: DCO
on: pull_request
jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every PR commit carries Signed-off-by
        run: |
          set -euo pipefail
          commits=$(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          [ -n "$commits" ] || { echo "no commits found"; exit 1; }
          bad=0
          for c in $commits; do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "MISSING Signed-off-by: $c $(git log -1 --format=%s "$c")"; bad=1
            fi
          done
          exit $bad
